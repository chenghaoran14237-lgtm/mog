services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES}
      OCR_PROVIDER: ${OCR_PROVIDER}
      OCR_BASE_URL: ${OCR_BASE_URL}
      OCR_MODEL: ${OCR_MODEL}
      OCR_PROVIDER_VARIANT: ${OCR_PROVIDER_VARIANT}
      OCR_API_KEY: ${OCR_API_KEY}
      OCR_PROVIDER_SECRET_REF: ${OCR_PROVIDER_SECRET_REF}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES}
      OCR_MAX_IMAGE_PAGES: ${OCR_MAX_IMAGE_PAGES}
      OCR_ENABLE_PDF_FALLBACK: ${OCR_ENABLE_PDF_FALLBACK}
      NORMALIZATION_PROVIDER: ${NORMALIZATION_PROVIDER}
      NORMALIZATION_PROVIDER_BASE_URL: ${NORMALIZATION_PROVIDER_BASE_URL}
      NORMALIZATION_PROVIDER_MODEL: ${NORMALIZATION_PROVIDER_MODEL}
      NORMALIZATION_PROVIDER_VARIANT: ${NORMALIZATION_PROVIDER_VARIANT}
      NORMALIZATION_PROVIDER_API_KEY: ${NORMALIZATION_PROVIDER_API_KEY}
      NORMALIZATION_PROVIDER_SECRET_REF: ${NORMALIZATION_PROVIDER_SECRET_REF}
      NORMALIZATION_PROVIDER_TIMEOUT_SECONDS: ${NORMALIZATION_PROVIDER_TIMEOUT_SECONDS}
      NORMALIZATION_PROVIDER_MAX_RETRIES: ${NORMALIZATION_PROVIDER_MAX_RETRIES}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_PROVIDER_BASE_URL: ${STORAGE_PROVIDER_BASE_URL}
      STORAGE_PROVIDER_MODEL: ${STORAGE_PROVIDER_MODEL}
      STORAGE_PROVIDER_VARIANT: ${STORAGE_PROVIDER_VARIANT}
      STORAGE_PROVIDER_API_KEY: ${STORAGE_PROVIDER_API_KEY}
      STORAGE_PROVIDER_SECRET_REF: ${STORAGE_PROVIDER_SECRET_REF}
      STORAGE_PROVIDER_TIMEOUT_SECONDS: ${STORAGE_PROVIDER_TIMEOUT_SECONDS}
      STORAGE_PROVIDER_MAX_RETRIES: ${STORAGE_PROVIDER_MAX_RETRIES}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_PROVIDER_BASE_URL: ${LLM_PROVIDER_BASE_URL}
      LLM_PROVIDER_MODEL: ${LLM_PROVIDER_MODEL}
      LLM_PROVIDER_VARIANT: ${LLM_PROVIDER_VARIANT}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY}
      LLM_PROVIDER_SECRET_REF: ${LLM_PROVIDER_SECRET_REF}
      LLM_PROVIDER_TIMEOUT_SECONDS: ${LLM_PROVIDER_TIMEOUT_SECONDS}
      LLM_PROVIDER_MAX_RETRIES: ${LLM_PROVIDER_MAX_RETRIES}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-80}:80"
    volumes:
      - ./deploy/nginx-lite.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  mysql_data:
